name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Preflight: probe the dependency graph by SBOM endpoint EXIT CODE before
  # dependency-review runs. Branches on exit code: 0 = ready, 403 = permission
  # gap (C7 — fail loudly, never silently pass), non-zero/404 = graph off.
  # The probe MUST NOT use `gh api -w '%{http_code}'` (that is a curl flag gh
  # silently ignores). The job is unconditional on PR/push (no continue-on-error,
  # no if: that can skip it on either protected trigger).
  repo-config-preflight:
    name: Repo config preflight
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Probe dependency graph via SBOM endpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Scope the exit-code probe to a single command without leaking the
          # raw output, then restore errexit semantics for the rest of the job.
          set +e
          gh api "repos/${REPO}/dependency-graph/sbom" >/dev/null 2>&1
          probe_rc=$?
          set -e
          if [ "$probe_rc" -eq 0 ]; then
            echo "::notice::Dependency graph is enabled (SBOM endpoint returned 200)."
            exit 0
          fi
          # Distinguish 403 (permission gap, C7) from 404 (graph off) by
          # re-probing with -i to capture the HTTP status line.
          http_status=$(gh api -i "repos/${REPO}/dependency-graph/sbom" 2>/dev/null | head -1 | grep -oE '[0-9]{3}' || echo "000")
          case "$http_status" in
            403)
              echo "::error::SBOM read rejected with 403 under permissions: contents: read."
              echo "::error::GitHub does not document contents: read as sufficient for GET .../dependency-graph/sbom."
              echo "::error::Fix: add an Administration-scoped token (Administration: read) to the preflight job, or escalate as a blocking design issue."
              echo "::error::This MUST be resolved before dependency-review can run. See docs/SECURITY_CI.md."
              exit 1
              ;;
            404)
              echo "::error::Dependency graph is disabled for this repository. dependency-review cannot run."
              echo "::error::Fix (requires admin, one line):"
              echo "::error::  gh api -X PUT repos/${REPO}/vulnerability-alerts"
              echo "::error::Then re-run this workflow. See docs/SECURITY_CI.md."
              exit 1
              ;;
            *)
              echo "::error::Unexpected SBOM probe response (HTTP ${http_status})."
              echo "::error::This is NOT a known config state. Likely causes:"
              echo "::error::  - Transient (429 rate-limit, 5xx GitHub outage, runner network): re-run the workflow."
              echo "::error::  - 401 auth/token: check GITHUB_TOKEN permissions or credential config — re-running will not fix this."
              echo "::error::Investigate before changing repository settings. See docs/SECURITY_CI.md."
              exit 1
              ;;
          esac

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    # NOTE: deliberately does NOT `needs: [repo-config-preflight]`. This job
    # scans the local uv.lock against PyPI advisories via pip-audit; it has no
    # dependency on the GitHub dependency graph. The preflight only runs on
    # PR/push, so gating this job on it would silently skip the weekly
    # scheduled audit.
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Audit root dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file requirements-root.txt
          uvx pip-audit@2.10.1 -r requirements-root.txt

      # Note: mesh-import has only lxml as dependency, already covered by
      # Dependabot and root audit. Its pyproject.toml has no separate lockfile.

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    needs: [repo-config-preflight]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@4901385134134e04cec5fbe5ddfe3b2c5bd5d976 # v4

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
